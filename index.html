<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- Style CSS -->
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main>
      <picture>
        <img
          src="./images/image-product-mobile.jpg"
          alt="Image of a Gabrielle de Chanel perfume bottle"
        />
      </picture>
      <section>
        <div class="perfume">
          <h1 class="perfume__title">Perfume</h1>
          <h1 class="perfume__name">Gabrielle Essence Eau De Parfum</h1>
          <p class="perfume_description">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="perfume__price">
            <p class="perfume__new-price">$149.99</p>
            <p class="perfume__old-price">$169.99</p>
          </div>
          <button class="perfume__btn">
            <img src="./images/icon-cart.svg" alt="cart icon" />
            Add to Cart
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
