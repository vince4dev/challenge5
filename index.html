<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- Style CSS -->
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <main id="main">
      <article class="perfume">
        <picture class="perfume__img">
          <source
            srcset="./assets/images/image-product-desktop.jpg"
            media="(min-width: 600px)"
          />
          <img
            src="./assets/images/image-product-mobile.jpg"
            alt="Image of a Gabrielle de Chanel perfume bottle"
          />
        </picture>

        <div class="perfume__description">
          <div class="perfume__text">
            <h1 class="perfume__title">Perfume</h1>
            <h2 class="perfume__name">Gabrielle Essence Eau De Parfum</h2>
            <p class="perfume__detail">
              A floral, solar and voluptuous interpretation composed by Olivier
              Polge, Perfumer-Creator for the House of CHANEL.
            </p>
          </div>
          <div class="perfume__price">
            <p class="perfume__new-price">$149.99</p>
            <del class="perfume__old-price">$169.99</del>
          </div>
          <button type="button" class="perfume__btn">
            <img
              src="./assets/images/icon-cart.svg"
              width="18"
              height="18"
              alt=""
            />
            Add to Cart
          </button>
        </div>
      </article>
    </main>
  </body>
</html>
